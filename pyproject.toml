[project]
name = "layerwatch"
version = "0.1.0"
description = "AML transaction monitoring prototype on the IBM AML dataset (HI-Small)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added per phase (see docs/decisions.md).
dependencies = [
    "duckdb>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layerwatch"]

# The code-agents package becomes a separate workspace member in phase 3
# (members = ["agents"]), so layerwatch can never depend on it.

[tool.uv]
# Use a uv-managed interpreter, independent of any local conda installation.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PD",       # pandas-vet
    "NPY",      # numpy-specific
    "PERF",     # performance anti-patterns (e.g. loops that should be vectorized)
    "DTZ",      # naive datetimes
    "S",        # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
